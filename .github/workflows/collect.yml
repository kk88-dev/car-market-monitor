name: Сбор объявлений

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа; бюджет запросов скрипт делит сам
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать данные
        env:
          RIA_API_KEY: ${{ secrets.RIA_API_KEY }}
        run: python collector/collect.py
      - name: Сохранить данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --staged --quiet; then
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
